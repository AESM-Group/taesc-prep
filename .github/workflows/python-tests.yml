name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest is Ubuntu 26.04, whose setup-python cache has no 3.9;
          # the declared floor still needs a runner that provides it.
          - python-version: "3.9"
            runner: ubuntu-22.04
          - python-version: "3.12"
            runner: ubuntu-latest
          - python-version: "3.15"
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install ".[test]"
      - name: Run tests
        run: python -m pytest -v
