[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taesc-prep"
version = "0.1.0"
description = "Prepare electronic-structure input data for TAESC"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
taesc-prep = "taesc_prep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
